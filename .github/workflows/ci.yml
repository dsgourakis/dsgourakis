# CI: checks every change. Runs on pull requests and on pushes to feature branches.
# deploy.yml also calls this workflow before deploying, so main/develop are checked there.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main
      - develop
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PHP tools
        run: composer install --no-interaction --no-progress

      - name: Install JS tools
        run: npm ci

      - name: PHP coding standards (PHPCS)
        run: composer lint

      - name: JavaScript lint
        run: npm run lint:js

      - name: CSS lint
        run: npm run lint:css

      - name: JavaScript unit tests (Jest)
        run: npm run test:js

      - name: Build blocks
        run: npm run build

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          npm ci

      - name: Build blocks
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Run PHPUnit
        run: npm run test:php
